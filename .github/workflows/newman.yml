name: Payment API Tests

on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 9 * * *'

  workflow_dispatch:

jobs:
  newman-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman newman-reporter-html

      - name: Run Payment API Tests
        run: newman run "Test API (2.1.0 v) Payment.postman_collection.json" -e "Environment_4_14.postman_environment.json" -d "data.csv" -r cli,html --reporter-html-export newman-report.html

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html
