name: SEPA and Invoice Payment API Tests

on:
  # Run automatically every day at 9:00 AM IST
  schedule:
    - cron: '30 3 * * *'

  # Run when code is pushed to main
  push:
    branches:
      - main

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-api-tests:
    name: Run Payment API Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Newman and HTML reporter
      - name: Install Newman
        run: |
          npm install -g newman newman-reporter-htmlextra
          newman --version

      # 4. Verify collection and environment files
      - name: Verify Postman Files
        run: |
          test -f "Test API (2.1.0 v) Payment.postman_collection.json"
          test -f "Environment_4_14.postman_environment.json"
          test -f "data.csv"

          echo "All required files found."

      # 5. Create report directory
      - name: Create Report Directory
        run: mkdir -p reports

      # 6. Run Direct Debit SEPA tests
      - name: Run Direct Debit SEPA Tests
        id: sepa_tests
        continue-on-error: true
        run: |
          newman run \
            "Test API (2.1.0 v) Payment.postman_collection.json" \
            -e "Environment_4_14.postman_environment.json" \
            --folder "Direct Debit SEPA" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/sepa-report.html

      # 7. Run Invoice tests
      - name: Run Invoice Tests
        id: invoice_tests
        continue-on-error: true
        run: |
          newman run \
            "Test API (2.1.0 v) Payment.postman_collection.json" \
            -e "Environment_4_14.postman_environment.json" \
            --folder "Invoice" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/invoice-report.html

      # 8. Create combined report summary
      - name: Create Test Summary
        if: always()
        run: |
          cat > reports/summary.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Payment API Test Summary</title>
          </head>
          <body>
            <h1>Payment API Test Summary</h1>
            <p>Automated SEPA and Invoice test execution.</p>
            <p>Individual HTML reports are attached separately.</p>
          </body>
          </html>
          HTML

      # 9. Upload reports to GitHub
      - name: Upload Payment Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Payment-API-Test-Reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      # 10. Email reports
      - name: Email Payment Test Reports
        if: always() && (hashFiles('reports/sepa-report.html') != '' || hashFiles('reports/invoice-report.html') != '')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Automated Payment API Test Results - SEPA and Invoice"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Hello,

            The automated payment API test execution has completed.

            Tests executed:
            - Direct Debit SEPA
            - Invoice

            Repository: ${{ github.repository }}

            View the GitHub Actions run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The generated HTML reports are attached to this email.

            Regards,
            GitHub Actions
          attachments: reports/sepa-report.html,reports/invoice-report.html

      # 11. Fail workflow if either test fails
      - name: Check Final Test Status
        if: always()
        env:
          SEPA_OUTCOME: ${{ steps.sepa_tests.outcome }}
          INVOICE_OUTCOME: ${{ steps.invoice_tests.outcome }}
        run: |
          if [ "$SEPA_OUTCOME" != "success" ] || \
             [ "$INVOICE_OUTCOME" != "success" ]; then
            echo "ERROR: One or both payment test suites failed."
            echo "SEPA result: $SEPA_OUTCOME"
            echo "Invoice result: $INVOICE_OUTCOME"
            exit 1
          fi

          echo "Both payment test suites completed successfully."
